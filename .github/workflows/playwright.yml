name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests run against ParaBank started in Docker below, not the public demo,
      # which rate-limits shared CI runner IPs (Cloudflare error 1015).
      BASE_URL: http://localhost:8080/parabank/
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Initialize ParaBank database and wait until it is ready
        run: |
          BASE=http://localhost:8080/parabank
          # A fresh container may need its database initialized (best effort).
          curl -sS -X POST -o /dev/null -w "initializeDB: HTTP %{http_code}\n" "$BASE/services/bank/initializeDB" || true
          # Ready = the seeded demo customer (john / demo) can log in through the API.
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/login.out -w "%{http_code}" -H "Accept: application/json" "$BASE/services/bank/login/john/demo" || true)
            echo "Attempt $i: login HTTP $code"
            if [ "$code" = "200" ]; then
              echo "ParaBank is ready"
              exit 0
            fi
            sleep 3
          done
          echo "ParaBank was not ready in time. Last response:"
          cat /tmp/login.out
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Show ParaBank container logs
        if: ${{ failure() }}
        run: docker logs ${{ job.services.parabank.id }} 2>&1 | tail -200

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14