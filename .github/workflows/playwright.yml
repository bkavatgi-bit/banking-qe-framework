name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests run against ParaBank started in Docker below, not the public demo,
      # which rate-limits shared CI runner IPs (Cloudflare error 1015).
      BASE_URL: http://localhost:8080/parabank/
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for ParaBank to start
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/parabank/index.htm; then
              echo "ParaBank is up"
              exit 0
            fi
            echo "Waiting for ParaBank ($i/60)..."
            sleep 3
          done
          echo "ParaBank did not start in time"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14